services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: colabora_test
      POSTGRES_PASSWORD: colabora_test
      POSTGRES_DB: colabora_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colabora_test -d colabora_test"]
      interval: 2s
      timeout: 2s
      retries: 20
